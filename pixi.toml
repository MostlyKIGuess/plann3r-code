[workspace]
name = "vggt-nav"
version = "1.0.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
navigate = "python run_nav.py"
train-planner = "cd training && torchrun --standalone --nproc_per_node 1 launch.py --config nav_costmap"
evaluate = "bash baseline/evaluate.sh"
clone-habitat = """
mkdir -p .dependencies && \
(test -d .dependencies/habitat-sim || git clone --depth 1 --branch v0.2.4 --recurse-submodules --shallow-submodules https://github.com/facebookresearch/habitat-sim.git .dependencies/habitat-sim) && \
(test -d .dependencies/habitat-lab || git clone --depth 1 --branch v0.2.4 https://github.com/facebookresearch/habitat-lab.git .dependencies/habitat-lab)
"""
setup-habitat = { depends-on = ["clone-habitat"], cmd = """
cd .dependencies/habitat-sim && \
pip install . --no-build-isolation && \
cd ../habitat-lab && \
pip install -e habitat-lab
""", env = { WITH_BULLET = "1", HEADLESS = "1", CMAKE_POLICY_VERSION_MINIMUM = "3.5", PYTHONNOUSERSITE = "1" } }

[dependencies]
python = "3.10.*"
cmake = ">=3.14"
ninja = "*"
git = "*"
pip = "*"
numpy = ">=1.26,<1.27"
scipy = "==1.13.1"
libstdcxx-ng = ">=12"
eigen = "*"
bullet = "*"
libgl = "*"
libglu = "*"
python-blosc2 = ">=2.7.1,<3"
networkx = ">=3.4.2,<4"
tqdm = ">=4.67.1,<5"
hydra-core = ">=1.3.2,<2"
opencv = ">=4.12,<5"
natsort = ">=8.4,<9"
yacs = ">=0.1.8,<0.2"
scikit-image = "*"
pandas = "*"
fvcore = ">=0.1.5.post20221221,<0.2"
iopath = ">=0.1.10,<0.2"
wcmatch = ">=10.1,<11"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
torch = "==2.7.1"
torchvision = "==0.22.1"
torch-geometric = "==2.6.1"
torchmetrics = "==1.7.0"
matplotlib = "*"
einops = "*"
trimesh = "*"
tensorboard = "*"
pyglet = "<2"
scikit-learn = "*"
huggingface-hub = ">=0.34,<1.0"
transformers = ">=4.56,<4.57"
safetensors = "*"
diffusers = ">=0.21"
h5py = "*"
wandb = "*"
prettytable = "*"
efficientnet-pytorch = "*"
warmup-scheduler = "*"
lmdb = "*"
vit-pytorch = "*"
positional-encodings = { version = "*", extras = ["pytorch"] }
