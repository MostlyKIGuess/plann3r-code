# Build the documentation site with MkDocs and publish it to GitHub Pages.
# Enable it once in the repository settings: Pages, source "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - real_world/README.md
      - history/README.md
      - mkdocs.yml
      - .github/workflows/docs.yml
      - .github/scripts/prepare_docs_site.sh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # MkDocs 2 drops the plugin and theme system Material relies on.
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - run: bash .github/scripts/prepare_docs_site.sh
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
