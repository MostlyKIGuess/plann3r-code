project_name: vggtnav-control
run_name: gnm_vggt_costmap
mode: train

# training setup
use_wandb: False
batch_size: 256
eval_batch_size: 256
epochs: 30
gpu_ids: [0]
num_workers: 8
eval_num_workers: 4
pin_memory: True
persistent_workers: True
prefetch_factor: 2
lr: 7e-4
optimizer: adam
seed: 0
scheduler: null
warmup: False
clipping: False

# model params
model_type: gnm
obs_encoding_size: 1024
goal_encoding_size: 1024
predict_dists: False

# input modalities
obs_type: image
goal_type: navmesh_costmap
costmap_filename: vggt_costmaps.npy
costmap_precompute_filename: vggt_costmaps.npy
use_precomputed_costmaps: True
use_lmdb_cache: True
image_tensor_cache_size: 2048
costmap_size: [16, 16]
costmap_channels: 1
costmap_normalization: per_map_minmax

# kept for compatibility with ObjRelLearntController config loading
goal_value_granularity: costmap
dims_segFt: 1
goal_use_pl: 0
goal_uses_context: False
goal_uses_stacked_context: False
is_pl_normalized: True
use_mask_grad: False
use_vel_filter: False
waypoint_index: -1
close_threshold: 3

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 5

# tradeoff between action and distance prediction loss
alpha: 0.5

# distance bounds for distance and action predictions
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 2
  max_dist_cat: 10
close_far_threshold: 10

# action output params
len_traj_pred: 5
learn_angle: True

# image params
image_size: [85, 64]

datasets:
  hm3d_iin_train:
    data_folder: $PLANN3R_ROOT/training/controller/predicted_costmap/data
    train: $PLANN3R_ROOT/training/controller/predicted_costmap/splits/train
    test: $PLANN3R_ROOT/training/controller/predicted_costmap/splits/test
    waypoint_spacing: 1
    end_slack: 0
    goals_per_obs: 1
    negative_mining: False

# logging
print_log_freq: 100
image_log_freq: 0
num_images_log: 0
pairwise_test_freq: 20
eval_fraction: 0.1
wandb_log_freq: 10
eval_freq: 2
