# Base controller training values. Experiment files override these values.
project_name: vint
run_name: vint

use_wandb: true
train: true
batch_size: 400
eval_batch_size: 400
epochs: 30
gpu_ids: [0]
num_workers: 4
lr: 5e-4
optimizer: adam
seed: 0
clipping: false
train_subset: 1.0

model_type: gnm
obs_encoding_size: 1024
goal_encoding_size: 1024

normalize: true
context_type: temporal
context_size: 5

alpha: 0.5
beta: 0.1

obs_type: image
goal_type: image
scheduler: null

distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 2
  max_dist_cat: 10
close_far_threshold: 10

len_traj_pred: 5
learn_angle: true
image_size: [85, 64]

print_log_freq: 100
image_log_freq: 1000
num_images_log: 8
pairwise_test_freq: 10
eval_fraction: 0.25
wandb_log_freq: 10
eval_freq: 1
